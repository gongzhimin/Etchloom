[package]
name = "etchloom"
version = "0.1.7"
description = "A local-first generative digital classical printmaking studio."
authors = ["Etchloom Authors"]
edition = "2021"

[lib]
name = "etchloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

