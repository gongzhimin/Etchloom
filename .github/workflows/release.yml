name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or get existing release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref_type === 'tag' ? context.ref_name : 'v0.1.0';
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              console.log('Using existing release ID:', existing.data.id);
              return existing.data.id;
            } catch (e) {
              console.log('Creating new release for tag:', tag);
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Etchloom ${tag}`,
                body: `## Etchloom Desktop Release\n\n- **Windows**: Download the \`.exe\` (NSIS installer) or \`.msi\` package below.\n- **macOS**: Download the \`.dmg\` package below.\n\n### Features:\n- Featherweight standalone desktop application (~15 MB)\n- 100% Offline base geometric printmaking engine & physical acid simulation\n- Integrated in-app WebGPU / WASM neural acceleration (Depth Anything V2 & Informative Drawings)\n- Automatic discovery & promotion to local Python CUDA service (\`127.0.0.1:7861\`)`,
                draft: false,
                prerelease: false
              });
              return data.id;
            }

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run automated test suite
        run: npm test

      - name: Prepare desktop web bundle
        run: npm run build

      - name: Build Tauri desktop application & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
