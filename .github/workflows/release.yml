name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or get existing release
        id: create-release
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        with:
          script: |
            let tag = process.env.REF_TYPE === 'tag' ? process.env.TAG_NAME : null;
            if (!tag && context.ref && context.ref.startsWith('refs/tags/')) {
              tag = context.ref.replace('refs/tags/', '');
            }
            tag = tag || 'v0.1.0';
            console.log('Resolving release for tag:', tag);
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              console.log('Using existing release ID:', existing.data.id);
              return existing.data.id;
            } catch (e) {
              console.log('Creating new release for tag:', tag);
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Etchloom ${tag}`,
                body: `## Etchloom Desktop & Mobile Release\n\n- **Android**: Download the \`.apk\` (ARM64) package below to install directly on your Android phone or tablet.\n- **Windows**: Download the \`.exe\` (NSIS installer) or \`.msi\` package below.\n- **macOS**: Download the \`.dmg\` package below.\n\n### Features:\n- 100% Offline standalone application (~35-40 MB)\n- Embedded dual neural networks (Informative Drawings & MiDaS v2.1 Small ONNX)\n- Integrated in-app WebGPU / WASM local hardware acceleration with zero CDN dependencies\n- Classical printmaking engine & physical acid simulation\n- Optimized touch-first mobile interaction with adaptive aspect ratio and bottom sheet drawers\n- Automatic discovery & promotion to local Python CUDA service (\`127.0.0.1:7861\`)\n\n---\n\n### 🍎 macOS 安装说明 (提示“已损坏，无法打开”解决办法):\n由于开源项目未购买苹果年费开发者证书，macOS Gatekeeper 安全机制会将下载的应用打上隔离标记并提示“已损坏”。\n**一秒解决步骤**：\n1. 将 \`Etchloom.app\` 从 DMG 拖入「应用程序 (Applications)」；\n2. 打开 Mac「终端 (Terminal)」，执行以下命令并输入电脑密码：\n\`\`\`bash\nsudo xattr -rd com.apple.quarantine /Applications/Etchloom.app\n\`\`\`\n执行完成后即可正常双击启动！`,
                draft: false,
                prerelease: false
              });
              return data.id;
            }

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run automated test suite
        run: npm test

      - name: Prepare desktop web bundle
        run: npm run build

      - name: Build Tauri desktop application & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  build-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # Automatically accept SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          # Select pre-installed NDK 26 or install if missing
          NDK_DIR=""
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -name "26.*" | sort -V | tail -n 1)
            if [ -z "$NDK_DIR" ]; then
              NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
            fi
          fi

          if [ -z "$NDK_DIR" ]; then
            echo "Installing NDK 26.1.10909125..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          fi

          echo "Selected Android NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Prepare web bundle
        run: npm run build

      - name: Initialize Android project if needed
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi

      - name: Build Android APK
        run: |
          npx tauri android build --apk --target aarch64

      - name: Sign & Package APK
        id: package-apk
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            TAG="v0.1.3"
          fi

          APK_SRC=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Found raw APK: $APK_SRC"

          if [ -z "$APK_SRC" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi

          # Generate a self-signed keystore to sign the release APK
          keytool -genkeypair -v -keystore release.jks -alias etchloom -keyalg RSA -keysize 2048 -validity 10000 -storepass etchloom123 -keypass etchloom123 -dname "CN=Etchloom, OU=Studio, O=Etchloom, L=Studio, S=State, C=US"

          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          OUTPUT_APK="Etchloom-${TAG}-android-arm64.apk"

          # Align and sign
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$APK_SRC" aligned.apk || cp "$APK_SRC" aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.jks --ks-pass pass:etchloom123 --key-pass pass:etchloom123 --out "$OUTPUT_APK" aligned.apk

          echo "Successfully generated signed APK: $OUTPUT_APK"
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-apk.outputs.apk_path }}
          path: ${{ steps.package-apk.outputs.apk_path }}

      - name: Upload APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.package-apk.outputs.release_tag }}"
          APK_FILE="${{ steps.package-apk.outputs.apk_path }}"
          echo "Uploading $APK_FILE to GitHub Release $TAG..."
          gh release upload "$TAG" "$APK_FILE" --clobber
