<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="610" viewBox="0 0 1260 610" role="img" aria-labelledby="title desc">
  <title id="title">Etchloom 双阶段界面布局</title>
  <desc id="desc">当前界面结构示意：母版预览和折叠面板，以及手工上版和木质工作台。</desc>
