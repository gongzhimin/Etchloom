    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#4b3b2b" flood-opacity=".12"/></filter>
    <pattern id="wood" width="120" height="46" patternUnits="userSpaceOnUse">
      <rect width="120" height="46" fill="#ead8bd"/>
      <path d="M0 9 C25 4 51 14 79 9 S109 5 120 7 M0 22 C21 20 42 26 72 21 S105 18 120 20 M0 36 C29 31 55 40 80 36 S111 32 120 34" fill="none" stroke="#b99a72" stroke-opacity=".32" stroke-width="1.4"/>
    </pattern>
    <clipPath id="master-clip"><rect x="100" y="168" width="444" height="271" rx="2"/></clipPath>
    <clipPath id="plate-clip"><rect x="871" y="212" width="289" height="253" rx="3"/></clipPath>
