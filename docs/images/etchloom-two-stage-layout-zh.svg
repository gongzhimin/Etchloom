    <path d="M973 321 C954 346 959 389 982 398 C1001 406 1029 394 1031 370 C1034 345 1016 316 996 314 C986 314 978 317 973 321Z"/>
    <path d="M993 330 H1017 M976 343 H1028 M970 356 H1031 M968 369 H1031 M971 382 H1028 M979 394 H1018"/>
